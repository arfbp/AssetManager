# ค่า agent.yaml ที่ต้องการสำหรับทั้งฟลีต - deploy แบบ GLOBAL
# (dist-agent-deploy-global/) สิ่งที่อยู่ในไฟล์นี้เป็นค่าที่ถูกต้องสำหรับ
# เอเจนต์ทุกเครื่องที่ติดตั้งไว้แล้ว ใช้โมเดล convergence เดียวกับที่
# self-update ใช้กับตัว binary เอง (ดู doc comment ของ needsUpdate ใน
# agentBuild.ts / registry.ts) - แก้ไฟล์นี้ รีสตาร์ต optifleet-server แล้ว
# ทุกเอเจนต์ที่เชื่อมต่ออยู่จะ converge มาตรงกันในรอบ heartbeat ถัดไป ดู
# agentConfig.ts ว่าโหลดและ diff อย่างไร
#
# ca_cert_path เชื่อถือ optifleet-cert.pem ที่แนบมากับ agent.yaml ในทุกการ
# ติดตั้งแบบ global-deploy - เป็น certificate self-signed สำหรับ IP ของ VPS
# (ไม่ใช่ certificate จาก CA จริง; ดู dist-agent-deploy-global/README.txt)
# ทุกการติดตั้งผ่าน install.ps1 ใช้ path C:\ProgramData\OptiFleetAgent
# เดียวกันหมด ไฟล์นี้ไฟล์เดียวจึงใช้ได้กับทั้งฟลีต ไม่ใช่แค่เครื่องเดียว

service:
  name: OptiFleetAIAgent
  display_name: "OptiFleet AI Agent"
  description: "OptiFleet AI fleet telemetry & management agent"

server:
  url: "wss://27.254.142.51:8443/"
  client_cert_path: ""
  client_key_path: ""
  ca_cert_path: "C:\\ProgramData\\OptiFleetAgent\\optifleet-cert.pem"
  hmac_secret_env: "OPTIFLEET_HMAC_SECRET"

polling:
  normal_interval: 5m
  alert_interval: 10s
  cpu_alert_threshold: 85.0
  mem_alert_threshold: 85.0
  recovery_streak: 3
  top_n_processes: 0 # 0 = report every running process, no cap

logging:
  dir: "C:\\ProgramData\\OptiFleetAgent\\logs"
  level: "info"
  max_size_mb: 10
  max_backups: 5
  max_age_days: 30

commands:
  # เปิด run_script ทั้งฟลีตผ่าน config-push โดยตั้งใจ - จำเป็นเพื่อให้
  # แดชบอร์ด/แอดมินส่งสคริปต์ติดตั้งซอฟต์แวร์ที่ระบุชัดเจน (ไม่ผ่านภาษา
  # ธรรมชาติ เช่น Ninite silent install) ไปยังเครื่องที่เลือกได้ ยังถูกกั้น
  # ด้วย OPTIFLEET_ENABLE_RUN_SCRIPT_DISPATCH ฝั่งเซิร์ฟเวอร์ และ env var
  # OPTIFLEET_ENABLE_RUN_SCRIPT ที่ config-push ตัวเดียวกันนี้ตั้งให้ service
  # - ดู internal/configpush
  allowed:
    - kill_process
    - clean_temp
    - restart_host
    - shutdown_host
    - network_diagnostic
    - run_script
  restart_confirm_delay: 30s
  clean_temp_allowed_dirs:
    - "%TEMP%"
    - "C:\\Windows\\Temp"
  script_timeout: 5m
  max_script_bytes: 32768
  # เพิ่มจาก 16384 เพื่อรองรับการสแกนรายการโปรแกรมที่ติดตั้งของ
  # Uninstall Software — เครื่องที่มีโปรแกรมติดตั้งอยู่ 150+ ตัว ข้อมูล
  # name/version/publisher/uninstall string เป็น JSON เกิน 16KB ได้สบายๆ
  max_script_output_bytes: 65536

self_heal:
  services:
    watch: []
    check_interval: 1m
    max_restarts_per_hour: 5
  disk_cleanup:
    free_threshold_percent: 10
    cooldown: 15m
  memory_leak:
    growth_threshold_mb: 500
    min_samples: 5
