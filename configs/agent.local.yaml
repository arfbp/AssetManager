service:
  name: OptiFleetAIAgentLocal
  display_name: "OptiFleet AI Agent (Local Run)"
  description: "Local demo run, not for production"

server:
  url: "wss://127.0.0.1:8443/"
  client_cert_path: ""
  client_key_path: ""
  ca_cert_path: "./server/test-cert.pem"
  hmac_secret_env: "OPTIFLEET_HMAC_SECRET"

polling:
  normal_interval: 5m
  alert_interval: 10s
  cpu_alert_threshold: 85.0
  mem_alert_threshold: 85.0
  recovery_streak: 3
  top_n_processes: 0 # 0 = report every running process, no cap

logging:
  dir: "./logs-local"
  level: "info"
  max_size_mb: 5
  max_backups: 1
  max_age_days: 1

commands:
  allowed:
    - kill_process
    - clean_temp
    - restart_host
    - shutdown_host
    - network_diagnostic
  restart_confirm_delay: 30s
  clean_temp_allowed_dirs:
    - "%TEMP%"
  script_timeout: 5m
  max_script_bytes: 32768
  max_script_output_bytes: 16384

self_heal:
  services:
    watch: []
    check_interval: 1m
    max_restarts_per_hour: 5
  disk_cleanup:
    free_threshold_percent: 10
    cooldown: 15m
  memory_leak:
    growth_threshold_mb: 500
    min_samples: 5
