# การตั้งค่าของ OptiFleet AI Agent
# ไฟล์นี้ deploy ไปพร้อมกับ binary ข้อมูลลับ (auth_token, passphrase ของ
# client cert) ควรมาจาก environment variable หรือ secrets manager ตอน
# production ห้าม commit ลง source control

service:
  name: OptiFleetAIAgent
  display_name: "OptiFleet AI Agent"
  description: "OptiFleet AI fleet telemetry & management agent"

server:
  # ใช้ wss:// เท่านั้น — ws:// แบบไม่เข้ารหัสจะถูกปฏิเสธตอนสตาร์ท
  url: "wss://fleet.example.internal/agent/ws"
  # path ของ client certificate สำหรับ mTLS เว้นว่างไว้เพื่อใช้ bearer-token
  # ผ่าน env var OPTIFLEET_AUTH_TOKEN แทน (แนะนำน้อยกว่า)
  client_cert_path: ""
  client_key_path: ""
  ca_cert_path: ""
  # secret สำหรับ HMAC ใช้ตรวจสอบความถูกต้องของลายเซ็นคำสั่งจากเซิร์ฟเวอร์
  # ใส่ค่าผ่าน env var OPTIFLEET_HMAC_SECRET เหลือว่างไว้เป็น placeholder
  hmac_secret_env: "OPTIFLEET_HMAC_SECRET"

polling:
  normal_interval: 5m
  alert_interval: 10s
  cpu_alert_threshold: 85.0
  mem_alert_threshold: 85.0
  # จำนวนการอ่านค่าปกติติดต่อกันที่ต้องมีก่อนจะออกจากโหมด alert
  recovery_streak: 3
  # 0 = รายงานทุก process ที่กำลังรัน ไม่จำกัด (payload/CPU ตอน Collect()
  # สูงขึ้น — ดูหมายเหตุเป้าหมายทรัพยากรใน README) ตั้งเป็นจำนวนบวกเพื่อจำกัด
  # ที่ top N ตามการใช้ CPU แทน
  top_n_processes: 0

logging:
  dir: "./logs"
  level: "info" # debug | info | warn | error
  max_size_mb: 10
  max_backups: 5
  max_age_days: 30

commands:
  # allowlist ที่ระบุชัดเจน — อะไรที่ไม่อยู่ในนี้จะถูกปฏิเสธเสมอ ไม่ว่า
  # เซิร์ฟเวอร์จะส่งอะไรมา
  #
  # "run_script" ตั้งใจไม่เปิดใช้งานตรงนี้ มันรันเนื้อหาสคริปต์ที่เซิร์ฟเวอร์
  # ส่งมาตรงๆ ในสิทธิ์ SYSTEM/root โดยไม่มีหน้าต่าง — เป็นความสามารถที่เสี่ยง
  # ที่สุดของเอเจนต์นี้ ถ้าจะเพิ่มเข้าไปในลิสต์นี้ เอเจนต์จะยังปฏิเสธการ
  # สตาร์ทถ้าไม่ได้ตั้ง OPTIFLEET_ENABLE_RUN_SCRIPT=true ใน environment ด้วย
  # (ประตูชั้นที่สองที่ตั้งใจไว้ — ดู doc comment ของ
  # internal/executor.runScript และหัวข้อ Self-Healing Engine ใน README
  # ก่อนเปิดใช้งาน)
  allowed:
    - kill_process
    - clean_temp
    - restart_host
    - shutdown_host
    - network_diagnostic
  restart_confirm_delay: 30s
  clean_temp_allowed_dirs:
    - "%TEMP%"
    - "C:\\Windows\\Temp"
  # ขอบเขตของ run_script ถ้าเปิดใช้งาน — override เป็นรายคำสั่งไม่ได้
  script_timeout: 5m
  max_script_bytes: 32768
  max_script_output_bytes: 16384

self_heal:
  # รีสตาร์ตอัตโนมัติ: service ที่เอเจนต์นี้เฝ้าดูและรีสตาร์ตให้ถ้าพบว่าหยุด
  # ทำงาน รายชื่อนี้ตายตัวอยู่ในไฟล์นี้เท่านั้น ขยายจากระยะไกลไม่ได้ —
  # ใส่ชื่อ service ตรงตามที่ปรากฏใน `sc query` (Windows),
  # `systemctl list-units` (Linux), หรือ `launchctl list` (macOS)
  services:
    watch:
      - "Spooler"        # ตัวอย่าง: Windows Print Spooler
      # - "postgresql-x64-16"
      # - "OpenVPNService"
    check_interval: 1m
    max_restarts_per_hour: 5   # กัน crash loop; เกินจำนวนนี้จะหยุดแตะแล้วแค่แจ้งเตือนแทน

  # ลบไฟล์อัตโนมัติ: ทำงานเมื่อพื้นที่ว่างของดิสก์ใดต่ำกว่าเปอร์เซ็นต์นี้
  # ใช้ commands.clean_temp_allowed_dirs เป็น allowlist ไดเรกทอรีเดียวกัน —
  # การลบอัตโนมัติจะไม่แตะอะไรนอกเหนือจากนี้เด็ดขาด
  disk_cleanup:
    free_threshold_percent: 10
    cooldown: 15m

  # ตรวจจับ memory leak: ตั้งธง process อันดับต้นๆ ที่ RSS โตขึ้นต่อเนื่อง
  # ทางเดียวอย่างน้อย growth_threshold_mb ตลอด min_samples snapshot
  # ติดต่อกัน เมื่อตั้งธง: พยายาม trim working-set (Windows เท่านั้น) และ
  # ส่ง "alert" ไปยังเซิร์ฟเวอร์ — ไม่เคยฆ่าหรือรีสตาร์ต process เองเลย
  memory_leak:
    growth_threshold_mb: 500
    min_samples: 5
